    <style>
        body {
            background-color: #343a40; /* Fundo escuro */
            color: #ffffff; /* Fonte branca */
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 20px;
            font-size: 1.5em;
            text-align: center;
            color: #f8f9fa; /* Cor clara para os títulos */
        }

        .logo {
            display: block;
            margin: 20px auto;
            width: 150px;
            height: auto;
        }

        footer {
            background-color: #212529; /* Fundo do rodapé */
            color: #ffffff;
            padding: 20px;
            border-top: 3px solid #f8f9fa; /* Linha superior para destaque */
        }

        footer a {
            color: #f8f9fa;
            text-decoration: underline;
        }

        section {
            margin-bottom: 40px;
            padding: 20px;
            background-color: #495057; /* Fundo das seções */
            border-radius: 8px; /* Bordas arredondadas */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3); /* Sombra leve */
        }

        .list-group-item {
            background-color: #495057; /* Fundo dos itens da lista */
            border: 1px solid #ced4da;
            color: #ffffff; /* Fonte branca nos itens */
        }

        .navbar {
            margin-bottom: 30px; /* Espaço abaixo da navbar */
            background-color: #212529; /* Fundo escuro para a navbar */
            border-bottom: 3px solid #f8f9fa; /* Linha inferior para destaque */
        }

        .navbar a {
            color: #f8f9fa; /* Cor clara para links da navbar */
            font-weight: bold; /* Negrito para links */
        }

        .navbar a:hover {
            color: #ffc107; /* Cor diferente ao passar o mouse */
        }
    </style>
</head>
